<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompter // Scroll Deck</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0d0c">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg: #0b0d0c;
    --panel: #14100c;
    --glass: #05403a;
    --amber: #e8a23c;
    --amber-dim: #7a5a26;
    --cyan: #46c9b6;
    --line: #2a2620;
    --text: #eae4d6;
    --text-dim: #8d8477;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow:hidden;
  }
  .rig{
    display:flex; height:100vh; width:100vw;
  }
  .rack{
    width:300px; min-width:300px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:18px 16px;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:18px;
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
  }
  .brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 8px var(--amber);
  }
  .brand h1{
    font-size:14px; letter-spacing:.14em; text-transform:uppercase;
    margin:0; font-weight:700; color:var(--text);
  }
  .brand span{ font-size:10px; color:var(--text-dim); letter-spacing:.1em;}

  .field-group{ display:flex; flex-direction:column; gap:8px; }
  .field-label{
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cyan); display:flex; align-items:center; gap:6px;
  }
  .field-label::before{ content:"›"; color:var(--amber); }

  .tabbar{ display:flex; gap:0; border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .tabbtn{
    flex:1; background:transparent; border:none; color:var(--text-dim);
    padding:8px 6px; font-family:inherit; font-size:11px; letter-spacing:.06em;
    cursor:pointer; text-transform:uppercase; border-right:1px solid var(--line);
  }
  .tabbtn:last-child{ border-right:none; }
  .tabbtn.active{ background:var(--glass); color:#eafff9; }

  textarea{
    width:100%; min-height:130px; resize:vertical;
    background:#0f0c08; color:var(--text); border:1px solid var(--line);
    border-radius:3px; padding:10px; font-family:inherit; font-size:12.5px;
    line-height:1.5;
  }
  textarea:focus{ outline:1px solid var(--amber); }

  input[type=file]{
    font-size:11px; color:var(--text-dim);
    background:#0f0c08; border:1px dashed var(--line); border-radius:3px;
    padding:10px; width:100%;
  }

  select, input[type=number]{
    width:100%; background:#0f0c08; color:var(--text);
    border:1px solid var(--line); border-radius:3px;
    padding:8px 8px; font-family:inherit; font-size:12px;
  }
  select:focus, input:focus{ outline:1px solid var(--amber); }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .speedbar{ display:flex; flex-wrap:wrap; gap:6px; }
  .speedbtn{
    background:#0f0c08; color:var(--text-dim); border:1px solid var(--line);
    border-radius:20px; padding:6px 12px; font-size:11px; cursor:pointer;
    font-family:inherit;
  }
  .speedbtn.active{ background:var(--amber); color:#241a06; border-color:var(--amber); font-weight:700; }

  .fontrow{ display:flex; align-items:center; gap:10px; }
  input[type=range]{ flex:1; accent-color:var(--amber); }
  .fontval{ font-size:11px; color:var(--text-dim); width:36px; text-align:right;}

  .transport{
    display:flex; gap:8px; margin-top:4px;
  }
  .btn{
    flex:1; padding:11px 8px; border-radius:3px; border:1px solid var(--line);
    background:#0f0c08; color:var(--text); font-family:inherit; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover{ border-color:var(--amber); }
  .btn.primary{ background:var(--amber); color:#241a06; border-color:var(--amber); font-weight:700;}
  .btn.primary:hover{ opacity:.92; }
  .btn.rec{ border-color:#5c1f1f; }
  .btn.rec.on{ background:#c0392b; color:#fff; border-color:#c0392b; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  .hint{
    font-size:10.5px; color:var(--text-dim); line-height:1.5;
    border-top:1px solid var(--line); padding-top:10px; margin-top:auto;
  }
  .hint b{ color:var(--cyan); }

  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; background:
      radial-gradient(ellipse at 50% 20%, #14201e 0%, var(--bg) 60%);
  }
  .monitor{
    position:relative;
    border:10px solid #1b1712;
    border-radius:10px;
    box-shadow: 0 0 0 1px #34302655, 0 30px 60px -20px #000c, inset 0 0 40px #0008;
    background:#000;
  }
  canvas{ display:block; background:#050505; }

  .status{
    position:absolute; top:16px; left:16px;
    display:flex; gap:10px; align-items:center;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
    pointer-events:none;
  }
  .status .chip{
    padding:3px 9px; border:1px solid var(--line); border-radius:20px; background:#0b0d0cbb;
  }
  .status .chip.play{ color:var(--cyan); border-color:#154a42; }

  .scrubwrap{
    position:absolute; bottom:14px; left:14px; right:14px;
    pointer-events:none;
  }
  .scrub{
    height:3px; width:100%; background:#ffffff22; border-radius:2px; overflow:hidden;
  }
  .scrub-fill{ height:100%; background:var(--amber); width:0%; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#2a2620; border-radius:4px; }
</style>
</head>
<body>

<div class="rig">
  <div class="rack">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>Prompter Deck</h1>
        <span>scroll · record · repeat</span>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Source</div>
      <div class="tabbar">
        <button class="tabbtn active" data-tab="text">Text</button>
        <button class="tabbtn" data-tab="image">Image</button>
      </div>

      <div id="panel-text">
        <textarea id="textInput" placeholder="I-type o i-paste ang iyong script dito...">Dayawen taku si Kabunian begew sin Inam-amag na
(Purihin natin ang Dios dahil sa Kanyang mga likha)

Dayawen! (Purihin)
Dayawen taku si Kabunian
(Purihin natin ang Dios)</textarea>
      </div>
      <div id="panel-image" style="display:none;">
        <input type="file" id="imageInput" accept="image/*">
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Canvas size</div>
      <select id="resPreset">
        <option value="1920x1080">1920 × 1080 (Full HD)</option>
        <option value="1280x720">1280 × 720 (HD)</option>
        <option value="custom">Custom...</option>
      </select>
      <div class="row2" id="customRes" style="display:none;">
        <input type="number" id="customW" placeholder="Width" value="1080">
        <input type="number" id="customH" placeholder="Height" value="1920">
      </div>
    </div>

    <div class="field-group" id="fontGroup">
      <div class="field-label">Font size (text mode)</div>
      <div class="fontrow">
        <input type="range" id="fontSize" min="20" max="140" value="48">
        <span class="fontval" id="fontSizeVal">48px</span>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Speed</div>
      <div class="speedbar" id="speedBar">
        <button class="speedbtn" data-speed="0.5">0.5x</button>
        <button class="speedbtn active" data-speed="1.0">1.0x</button>
        <button class="speedbtn" data-speed="1.5">1.5x</button>
        <button class="speedbtn" data-speed="2.0">2.0x</button>
        <button class="speedbtn" data-speed="3.0">3.0x</button>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Transport</div>
      <div class="transport">
        <button class="btn primary" id="playBtn">▶ Play</button>
        <button class="btn" id="replayBtn">⟲ Replay</button>
      </div>
      <select id="recFps">
        <option value="24">24 fps — smoother on slow devices</option>
        <option value="30" selected>30 fps — standard</option>
      </select>
      <div class="transport">
        <button class="btn rec" id="recBtn">● Record screen</button>
      </div>
    </div>

    <div class="hint">
      <b>Replay</b> = babalik sa simula.<br>
      Recording captures <b>only</b> the prompter canvas — hindi kasama ang mga buttons kahit ano pa mangyari sa screen.
    </div>
  </div>

  <div class="stage">
    <div class="monitor" id="monitor">
      <canvas id="stageCanvas"></canvas>
    </div>
    <div class="scrubwrap">
      <div class="scrub"><div class="scrub-fill" id="scrubFill"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('stageCanvas');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
  const MAX_CONTENT_H = 24000; // hard cap so huge images/scripts don't blow up memory/GPU

  const state = {
    mode: 'text',
    playing: false,
    speed: 1.0,
    scrollY: 0,
    fontSize: 48,
    canvasW: 1920,
    canvasH: 1080,
    contentCanvas: null,
    contentH: 0,
    lastTime: null,
    recording: false,
    mediaRecorder: null,
    chunks: []
  };

  const BASE_SPEED = 90; // px per second at 1.0x

  function fitCanvasToScreen(){
    canvas.width = state.canvasW;
    canvas.height = state.canvasH;
    const maxW = window.innerWidth - 340;
    const maxH = window.innerHeight - 90;
    const scale = Math.min(maxW / state.canvasW, maxH / state.canvasH, 1);
    canvas.style.width = (state.canvasW * scale) + 'px';
    canvas.style.height = (state.canvasH * scale) + 'px';
  }
  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvasToScreen, 120);
  });

  document.getElementById('resPreset').addEventListener('change', (e)=>{
    const v = e.target.value;
    document.getElementById('customRes').style.display = v === 'custom' ? 'grid' : 'none';
    if(v === '1920x1080'){ state.canvasW=1920; state.canvasH=1080; }
    else if(v === '1280x720'){ state.canvasW=1280; state.canvasH=720; }
    applyResize();
  });
  document.getElementById('customW').addEventListener('input', (e)=>{
    state.canvasW = parseInt(e.target.value)||1080; applyResize();
  });
  document.getElementById('customH').addEventListener('input', (e)=>{
    state.canvasH = parseInt(e.target.value)||1920; applyResize();
  });

  function applyResize(){
    fitCanvasToScreen();
    rebuildContent();
    resetScroll();
  }

  document.querySelectorAll('.tabbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.tab;
      document.getElementById('panel-text').style.display = state.mode==='text' ? 'block':'none';
      document.getElementById('panel-image').style.display = state.mode==='image' ? 'block':'none';
      document.getElementById('fontGroup').style.display = state.mode==='text' ? 'flex':'none';
      rebuildContent();
      resetScroll();
    });
  });

  let textDebounce = null;
  document.getElementById('textInput').addEventListener('input', ()=>{
    if(state.mode!=='text') return;
    clearTimeout(textDebounce);
    textDebounce = setTimeout(()=>{ rebuildContent(); resetScroll(); }, 220);
  });

  let loadedImage = null;
  document.getElementById('imageInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    img.onload = ()=>{
      loadedImage = img;

      // auto width: match the canvas to the image's native width so nothing stretches or blurs
      state.canvasW = img.naturalWidth;
      document.getElementById('resPreset').value = 'custom';
      document.getElementById('customRes').style.display = 'grid';
      document.getElementById('customW').value = state.canvasW;

      applyResize();
    };
    img.src = URL.createObjectURL(file);
  });

  let fontDebounce = null;
  document.getElementById('fontSize').addEventListener('input', (e)=>{
    state.fontSize = parseInt(e.target.value);
    document.getElementById('fontSizeVal').textContent = state.fontSize+'px';
    if(state.mode!=='text') return;
    clearTimeout(fontDebounce);
    fontDebounce = setTimeout(()=>{ rebuildContent(); resetScroll(); }, 150);
  });

  document.querySelectorAll('.speedbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.speedbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.speed = parseFloat(btn.dataset.speed);
    });
  });

  function rebuildContent(){
    const off = document.createElement('canvas');
    off.width = state.canvasW;

    if(state.mode === 'image' && loadedImage){
      const w = state.canvasW;
      let h = loadedImage.height * (w / loadedImage.width);
      if(h > MAX_CONTENT_H){ h = MAX_CONTENT_H; } // avoid oversized canvas causing GPU/memory lag
      off.height = h;
      const octx = off.getContext('2d', { alpha:false });
      octx.drawImage(loadedImage, 0, 0, w, loadedImage.height * (w / loadedImage.width));
      state.contentH = h;
    } else {
      const octx0 = off.getContext('2d');
      const fs = state.fontSize;
      octx0.font = fs+'px Georgia, serif';
      const text = document.getElementById('textInput').value || '';
      const paragraphs = text.split('\n');
      const maxLineW = state.canvasW * 0.82;
      const lines = [];
      paragraphs.forEach(p=>{
        if(p.trim()===''){ lines.push(''); return; }
        const words = p.split(' ');
        let cur = '';
        words.forEach(w=>{
          const test = cur ? cur+' '+w : w;
          if(octx0.measureText(test).width > maxLineW && cur){
            lines.push(cur); cur = w;
          } else { cur = test; }
        });
        if(cur) lines.push(cur);
      });
      const lineH = fs * 1.5;
      const totalH = Math.min(lines.length * lineH + fs*4, MAX_CONTENT_H);
      off.height = totalH;
      const octx = off.getContext('2d', { alpha:false });
      octx.fillStyle = '#000';
      octx.fillRect(0,0,off.width,off.height);
      octx.font = fs+'px Georgia, serif';
      octx.fillStyle = '#f4efe2';
      octx.textAlign = 'center';
      octx.textBaseline = 'top';
      lines.forEach((line, i)=>{
        octx.fillText(line, off.width/2, fs*2 + i*lineH);
      });
      state.contentH = totalH;
    }
    state.contentCanvas = off;
  }

  function resetScroll(){
    state.scrollY = 0; // show content immediately instead of a blank frame that needs scrolling into view
    state.lastTime = null;
    drawFrame();
    updateScrub();
  }

  function updateScrub(){
    const total = Math.max(1, state.contentH);
    const progress = Math.min(1, Math.max(0, state.scrollY / total));
    document.getElementById('scrubFill').style.width = (progress*100)+'%';
  }

  function drawFrame(){
    ctx.fillStyle = '#050505';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    if(state.contentCanvas){
      ctx.drawImage(state.contentCanvas, 0, -state.scrollY);
    }
  }

  let frameCount = 0;
  function tick(ts){
    if(state.playing){
      if(state.lastTime == null) state.lastTime = ts;
      const dt = (ts - state.lastTime) / 1000;
      state.lastTime = ts;
      state.scrollY += BASE_SPEED * state.speed * dt;
      const maxScroll = state.contentH;
      if(state.scrollY >= maxScroll){
        state.scrollY = maxScroll;
        setPlaying(false);
      }
      drawFrame();
      frameCount++;
      if(frameCount % 3 === 0) updateScrub(); // scroll stays 60fps; progress bar updates ~20x/sec, plenty smooth
    } else {
      state.lastTime = null;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const playBtn = document.getElementById('playBtn');

  function setPlaying(val){
    state.playing = val;
    playBtn.textContent = val ? '❚❚ Pause' : '▶ Play';
  }
  playBtn.addEventListener('click', ()=> setPlaying(!state.playing));

  document.getElementById('replayBtn').addEventListener('click', ()=>{
    setPlaying(false);
    resetScroll();
  });

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){
      const tag = document.activeElement.tagName;
      if(tag === 'TEXTAREA' || tag === 'INPUT') return;
      e.preventDefault();
      setPlaying(!state.playing);
    }
  });

  const recBtn = document.getElementById('recBtn');
  recBtn.addEventListener('click', ()=>{
    if(!state.recording){
      startRecording();
    } else {
      stopRecording();
    }
  });

  function startRecording(){
    const fps = parseInt(document.getElementById('recFps').value) || 30;
    const stream = canvas.captureStream(fps);
    const bitrate = Math.round(4_000_000 * (state.canvasW*state.canvasH)/(1920*1080)); // scale bitrate to resolution
    let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: bitrate };
    if(!MediaRecorder.isTypeSupported(options.mimeType)){
      options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: bitrate };
    }
    if(!MediaRecorder.isTypeSupported(options.mimeType)){
      options = { mimeType: 'video/webm', videoBitsPerSecond: bitrate };
    }
    state.chunks = [];
    state.mediaRecorder = new MediaRecorder(stream, options);
    state.mediaRecorder.ondataavailable = (e)=>{
      if(e.data && e.data.size>0) state.chunks.push(e.data);
    };
    state.mediaRecorder.onstop = ()=>{
      const blob = new Blob(state.chunks, {type:'video/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prompter-recording-'+Date.now()+'.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
    };
    state.mediaRecorder.start();
    state.recording = true;
    recBtn.textContent = '■ Stop recording';
    recBtn.classList.add('on');
  }

  function stopRecording(){
    if(state.mediaRecorder && state.mediaRecorder.state !== 'inactive'){
      state.mediaRecorder.stop();
    }
    state.recording = false;
    recBtn.textContent = '● Record screen';
    recBtn.classList.remove('on');
  }

  fitCanvasToScreen();
  rebuildContent();
  resetScroll();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
